name: minik_app_tania
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.5
  get: ^4.6.6
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.15
  url_launcher: ^6.1.10
  shimmer: ^3.0.0
  firebase_messaging: ^16.0.2


  # Firebase
  firebase_core: ^4.1.0
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.1
  intl: ^0.20.2

  # Animaciones Lottie
  lottie: ^3.1.0
  qr_flutter: ^4.1.0
  pdf: ^3.11.3
  printing: ^5.14.2
  font_awesome_flutter: ^10.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/fondof.jpg
    - assets/images/Logominik.png
    - assets/images/iconomink.png
    - assets/animations/

# 👇 Configuración solo de ícono de app
flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/Logominik.png"
